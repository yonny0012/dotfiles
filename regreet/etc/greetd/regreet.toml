[background]
path = "/usr/share/backgrounds/background.jpg"
fit = "Cover"

[GTK]
application_id = "com.rossau.regreet"
dark_theme = true
font_name = "JetBrainsMono Nerd Font 11"
cursor_theme_name = "Catppuccin-Macchiato-Mauve"
custom_css = "/etc/greetd/style.css"

[commands]
reboot = ["systemctl", "reboot"]
poweroff = ["systemctl", "poweroff"]
