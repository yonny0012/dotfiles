### MangoHud — OSD pensado para 1366x768 (pantalla chica, no tapar el juego)
### Se activa por juego con `mangohud %command%`. Sin eso, no carga nada.
### Toggle en caliente: Shift_R+F12

# --- Qué se muestra -----------------------------------------------------------
# La iGPU no expone temperatura ni ventilador por sysfs en Kaby Lake-R, así que
# `gpu_temp`/`gpu_fan` se omiten para no mostrar "N/A" permanente.
gpu_stats
cpu_stats
fps
frametime
frame_timing
throttling_status
ram
vram
gamemode
resolution
display_server

# --- Layout ------------------------------------------------------------------
position=top-left
font_size=16
background_alpha=0.4
round_corners=8
text_outline
hud_compact

# --- Colores (paleta del desktop) --------------------------------------------
text_color=CAD3F5
gpu_color=A6DA95
cpu_color=8AADF4
frametime_color=91D7E3
background_color=1E1E2E

# --- Límite de fps ------------------------------------------------------------
# Sin límite por defecto: la UHD 620 ya va justa. Si un juego calienta de más,
# descomentar y fijar (ej. 30 para títulos pesados, 40 para 2D/indies).
# fps_limit=30
