# ==============================================================================
# Kitty Configuration
# Architecture: GNU Stow Modular Setup (Debian / Hyprland)
# Theme: Catppuccin Macchiato
# ==============================================================================

# --- [ Fonts ] ----------------------------------------------------------------
# Using JetBrainsMono Nerd Font for optimal readability and glyph support (Starship/Eza)
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# --- [ Window & Interface ] ---------------------------------------------------
# Disable kitty's own titlebar/borders since Hyprland handles window management
hide_window_decorations yes
window_padding_width    8

# Background opacity (only works if a compositor like Hyprland is running)
background_opacity 0.95

# --- [ Performance & Behavior ] -----------------------------------------------
# Disable the close confirmation (since we use Zellij for multiplexing and Hyprland)
confirm_os_window_close 0

# Sync to monitor refresh rate (prevents tearing in Wayland)
sync_to_monitor yes

# Enable audio bell? No, visual bell only.
enable_audio_bell no
visual_bell_duration 0.0

# --- [ Colors & Theme ] -------------------------------------------------------
include catppuccin-macchiato.conf