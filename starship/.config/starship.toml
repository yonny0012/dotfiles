# ==============================================================================
# Starship Configuration
# Arch: GNU Stow
# Theme: Catppuccin Macchiato
# ==============================================================================

# Use custom formatting
format = """
[╭─](bold #cad3f5) $os$directory$git_branch$git_status$git_state$git_metrics$c$golang$nodejs$python$rust
[╰─](bold #cad3f5) $character
"""

# Wait 10 milliseconds for starship to check files under the current directory.
scan_timeout = 10

# Disable the blank line at the start of the prompt
add_newline = false

[character]
success_symbol = "[❯](bold #a6da95)"
error_symbol = "[❯](bold #ed8796)"
vimcmd_symbol = "[❮](bold #a6da95)"

[os]
disabled = false
format = "[$symbol]($style) "
style = "bold #8aadf4"

[os.symbols]
Debian = " "
Linux = " "
Arch = " "
Macos = " "

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold #8aadf4"
read_only = " 󰌾"
read_only_style = "bold #ed8796"
truncate_to_repo = true
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "
symbol = " "
style = "bold #c6a0f6"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold #ed8796"
conflicted = "󰞆 "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead}⇣${behind}"
untracked = "?${count}"
stashed = "󰏗 "
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bold #f5a97f"

[git_metrics]
disabled = false

[c]
format = "[$symbol($version(-$name) )]($style)"
symbol = " "
style = "bold #8aadf4"

[golang]
format = "[$symbol($version )]($style)"
symbol = " "
style = "bold #8bd5ca"

[nodejs]
format = "[$symbol($version )]($style)"
symbol = " "
style = "bold #a6da95"

[python]
format = '[$symbol$pyenv_prefix($version )(\($virtualenv\) )]($style)'
symbol = " "
style = "bold #eed49f"

[rust]
format = "[$symbol($version )]($style)"
symbol = " "
style = "bold #ed8796"

[cmd_duration]
min_time = 2000
format = "[$duration]($style)"
style = "bold #f5a97f"

# Catppuccin Macchiato Palette Reference
palette = "catppuccin_macchiato"

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adce"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
mantle = "#1e2030"
crust = "#11111b"