; ==============================================================================
; GameMode — perfil de rendimiento acotado a la sesión de juego
; Se aplica SOLO mientras corre un proceso lanzado con `gamemoderun`.
; Fuera de eso el sistema queda como estaba: el desarrollo no paga el costo.
; Hardware: i5-8250U (15 W) + UHD 620 → CPU e iGPU comparten el mismo
; presupuesto de energía, por eso NO se fuerza el gobernador a performance.
; ==============================================================================

[general]
; performance fijaría la CPU arriba y le robaría watts a la iGPU en un chip
; de 15 W: menos fps y más throttling. powersave deja actuar a HWP, que ya
; sube a turbo bajo carga. Cambiar a `performance` solo en equipos de escritorio.
desiredgov=powersave

; El gobernador de la iGPU solo aplica cuando ésta está bajo carga. Con -1 se
; desactiva esa heurística y se usa siempre `desiredgov` (comportamiento estable).
igpu_desiredgov=powersave
igpu_power_threshold=-1

; Renice y prioridad de I/O del proceso del juego. 0 = sin cambio de nice
; (renicear requiere el grupo `gamemode` y no aporta en un 4c/8t).
renice=0
ioprio=0

; Evita que hypridle bloquee la pantalla a mitad de partida.
inhibit_screensaver=1

; Desactiva la mitigación de split-lock durante el juego: algunos títulos con
; operaciones atómicas desalineadas pierden mucho rendimiento con ella activa.
; Queda acotado a la sesión de gamemode (es el valor por defecto de GameMode).
disable_splitlock=1

[cpu]
; Pinning/parking de núcleos: sin efecto útil acá (no hay P/E-cores ni X3D).
pin_cores=no
park_cores=no

[gpu]
; Sin overclock ni perfiles de energía: la UHD 620 no expone nada de eso en
; Linux y forzar el nivel de rendimiento solo agrega calor.
