# ==============================================================================
# MAIN HYPRLAND CONFIGURATION FILE (MODULAR)
# ==============================================================================
# Este archivo es el punto de entrada principal.
# Toda la lógica está separada en el directorio conf.d/ respetando la 
# arquitectura modular de los dotfiles.

# 1. Variables de entorno y Monitores
source = ~/.config/hypr/conf.d/env.conf
source = ~/.config/hypr/conf.d/monitors.conf

# 2. Servicios y Ejecuciones Automáticas (Waybar, Eww, Fondos)
source = ~/.config/hypr/conf.d/execs.conf

# 3. Estilos (UI/UX, Glassmorphism, Bordes, Animaciones)
source = ~/.config/hypr/conf.d/theme.conf

# 4. Reglas de Comportamiento de Ventanas
source = ~/.config/hypr/conf.d/rules.conf

# 5. Atajos de Teclado (Keybinds) y Mouse
source = ~/.config/hypr/conf.d/keybinds.conf

# 6. Configuraciones de logs ...
source = ~/.config/hypr/conf.d/settings.conf
