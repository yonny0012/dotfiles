# ==============================================================================
# Execs (Autostart)
# ==============================================================================

# Demonios esenciales
exec-once = /usr/lib/polkit-kde-authentication-agent-1 & # Ajusta a polkit-gnome si usas ese
exec-once = waybar
exec-once = eww daemon
exec-once = dunst # O reemplazable por swaync/mako
exec-once = cliphist daemon # Historial del portapapeles
exec-once = udiskie # monta discos y unidades removibles

# Portapapeles
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Wallpaper daemon (Hyprpaper o Swaybg)
exec-once = swaybg -m fill -i ~/Pictures/background.jpg
