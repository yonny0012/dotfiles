# ==============================================================================
# Rules & Blur (Window & Layer rules)
# Hyprland 0.54+ Nested Syntax
# ==============================================================================

# ====================
# Layer Rules (Barras, Menus)
# ====================

layerrule {
    name = blur-waybar
    match:namespace = waybar

    blur = true
    ignore_alpha = 0
}

layerrule {
    name = blur-eww
    match:namespace = eww-dashboard

    blur = true
    ignore_alpha = 0.5
}

layerrule {
    name = blur-wofi
    match:namespace = wofi

    blur = true
    ignore_alpha = 0
}

# ====================
# Window Rules (Apps flotantes o ignoradas)
# ====================

windowrule {
    name = float-pavucontrol
    match:class = pavucontrol
    float = true
}

windowrule {
    name = float-blueman
    match:class = blueman-manager
    float = true
}

windowrule {
    name = float-nmconnection
    match:class = nm-connection-editor
    float = true
}

windowrule {
    name = opacity-kitty
    match:class = kitty
    opacity = 0.85 0.85
}

windowrule {
    name = no-idle-brave
    match:class = brave
    match:fullscreen = true
    idle_inhibit = fullscreen
}

windowrule {
    name = tor-browser
    match:class = tor-browser
    float = true
    center = true
}

windowrule{
    name = float-desktop-portal
    match:class = xdg-desktop-portal-gtk
    float = true
    center = true
    size = 800 600
}

windowrule{
    name = float-filemanager
    match:class = ^(thunar|xdg-desktop-portal-gtk)$
    match:title = ^(Open File|Save File|Abrir|Guardar|All Files)$
    float = true
    center = true
    size = 800 600
    opacity = 0.8 0.7
}

windowrule{
    name = blur-vs-code
    match:class = code
    opacity = 0.75 0.95
}
windowrule{
    name = float-bitwarden
    match:title = ^(Bitwarden)$
    float = true
    center = true
    size = 400 600
}

# ====================
# Music & Monitoring
# ====================

windowrule {
    name = float-ncmpcpp
    match:class = ncmpcpp
    float = true
    size = 1000 600
    center = true
}

windowrule {
    name = float-missioncenter
    match:class = io.missioncenter.MissionCenter
    float = true
    size = 800 600
    center = true
    opacity = 0.9 0.8
}
