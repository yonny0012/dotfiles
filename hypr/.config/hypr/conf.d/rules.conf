# ==============================================================================
# Rules & Blur (Window & Layer rules)
# Hyprland 0.54+ Nested Syntax
# ==============================================================================

# ====================
# Layer Rules (Barras, Menus)
# ====================

layerrule {
    name = blur-waybar
    match:namespace = waybar
    blur = true
    ignore_alpha = 0
}

layerrule {
    name = blur-eww-dashboard
    match:namespace = eww-dashboard
    blur = true
    ignore_alpha = 0.5
}

layerrule {
    name = blur-power-menu
    match:namespace = power-menu
    blur = true
    ignore_alpha = 0.2
}
# Animación suave tipo fade para el power menu
layerrule {
    name = anim-power-menu
    match:namespace = power-menu
    animation = fade
}

layerrule {
    name = blur-wofi
    match:namespace = wofi
    blur = true
    ignore_alpha = 0
}

layerrule {
    name = blur-notifications
    match:namespace = mako
    blur = true
    ignore_alpha = 0.3
}

layerrule {
    name = blur-monitor-sidebar
    match:namespace = monitor-sidebar
    blur = true
    ignore_alpha = 0.3
}

layerrule {
    name = anim-monitor-sidebar
    match:namespace = monitor-sidebar
    animation = fade
}

# ════════════════════════════════════════════════════════════════════════
# WINDOW RULES — Aplicaciones
# ════════════════════════════════════════════════════════════════════════
 
# ── Herramientas del sistema ──────────────────────────────────────────
 
windowrule {
    name = float-pavucontrol
    match:class = pavucontrol
    float = true
    size = 700 450
    center = true
}
 
windowrule {
    name = float-blueman
    match:class = blueman-manager
    float = true
    center = true
}
 
windowrule {
    name = float-nmconnection
    match:class = nm-connection-editor
    float = true
    center = true
}

# ── Terminal ──────────────────────────────────────────────────────────
 
windowrule {
    name = opacity-kitty
    match:class = kitty
    opacity = 0.85 1
}

# ── Visualizador de audio ─────────────────────────────────────────────
 
windowrule {
    name = float-cava
    match:class = ncmpcpp
    match:title = ^(cava)$
    float = true
    opacity = 0.9 0.9
}

# ── Navegadores ───────────────────────────────────────────────────────
 
windowrule {
    name = no-idle-brave-fullscreen
    match:class = brave-browser
    match:fullscreen = true
    idle_inhibit = fullscreen
}

# ── Privacidad / Seguridad ────────────────────────────────────────────
 
windowrule {
    name = float-tor
    match:class = tor-browser
    float = true
    center = true
}
 
windowrule {
    name = float-bitwarden
    match:title = ^(Bitwarden)$
    float = true
    center = true
    size = 400 600
}

# windowrule{
#    name = float-desktop-portal
#    match:class = xdg-desktop-portal-gtk
#    float = true
#    center = true
#    size = 800 600
#}  

# ── Gestores de archivos y portales ──────────────────────────────────
# NOTA: initial_title para diálogos que cambian el título tras abrirse

windowrule {
    name = float-filemanager-dialogs
    match:class = ^(thunar|xdg-desktop-portal-gtk)$
    match:title = ^(Open File|Save File|Abrir|Guardar|All Files|Rename)$
    float = true
    center = true
    size = 800 600
    opacity = 0.8 0.7
}

# ── Editores ──────────────────────────────────────────────────────────

windowrule {
    name = opacity-vscode
    match:class = code
    opacity = 0.75 0.95
}

# ── Videollamadas — popups de compartir pantalla ──────────────────────
# Usa expresiones de posición: monitor_h en lugar de valor hardcodeado

windowrule {
    name = meet-share-popup
    match:title = ^(meet\.google\.com is sharing your screen\.)
    float = true
    move = 0 (monitor_h-330)
}

# ── Música & Monitoreo ────────────────────────────────────────────────
 
windowrule {
    name = float-ncmpcpp
    match:class = ncmpcpp
    float = true
    size = 1000 600
    center = true
}
 
windowrule {
    name = float-missioncenter
    match:class = io.missioncenter.MissionCenter
    float = true
    size = 800 600
    center = true
    opacity = 0.9 0.8
}

# ── Power Menu (eww) ──────────────────────────────────────────────────
# La ventana eww del power menu se trata como overlay fullscreen flotante.
# `stay_focused` evita que pierda el foco al hacer clic en botones internos.
# `pin` la mantiene visible en todos los workspaces.
 
windowrule {
    name = float-power-menu
    match:class = power-menu
    float = true
}
 
windowrule {
    name = pin-power-menu
    match:class = power-menu
    pin = true
}
 
windowrule {
    name = focus-power-menu
    match:class = power-menu
    stay_focused = true
}
 
windowrule {
    name = noborder-power-menu
    match:class = power-menu
    rounding = 0
}
