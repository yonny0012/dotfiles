# ==============================================================================
# MPD (Music Player Daemon) Configuration
# Arquitectura: GNU Stow Modular Setup (Debian / Hyprland / PipeWire)
# Optimizado para: Bajo consumo energético, cero I/O innecesario y baja latencia
# ==============================================================================

# --- [ Directorios y Almacenamiento (Estándar XDG) ] -------------------------
# Mantiene la biblioteca y listas en XDG data, y el estado volátil en XDG state
music_directory                  "~/Music"
playlist_directory               "~/.local/share/mpd/playlists"
db_file                          "~/.local/share/mpd/database"
state_file                       "~/.local/state/mpd/state"
sticker_file                     "~/.local/share/mpd/sticker.sql"

# --- [ Logging & Supervisión ] -----------------------------------------------
# "syslog" delega el registro al journal de systemd (journalctl --user -u mpd)
# Evita escrituras directas a disco para prolongar la vida del SSD y ahorrar energía
log_file                         "syslog"

# --- [ Conexión & Red (IPC Híbrido) ] -----------------------------------------
# 1. Socket Unix: Conexión ultrarrápida local sin sobrecarga del stack de red TCP
bind_to_address                  "~/.local/state/mpd/socket"

# 2. Loopback TCP: Para máxima compatibilidad (Waybar, clientes remotos/scripts)
bind_to_address                  "127.0.0.1"
port                             "6600"

# --- [ Reproducción & Rendimiento Energético (Low Power / C-States) ] ----------
# Restaura el estado de la lista y pausa al reiniciar el servicio
restore_paused                   "yes"

# Auto-actualización de la base de datos al añadir archivos a ~/Music
auto_update                      "yes"
auto_update_depth                "3"

# Un buffer generoso (4MB) permite a MPD decodificar en ráfagas breves y dejar
# al procesador reposar en estados profundos de bajo consumo (C-States)
audio_buffer_size                "4096"

# --- [ Salidas de Audio ] -----------------------------------------------------

# 1. Salida nativa PipeWire (Integración directa con WirePlumber y wpctl)
audio_output {
    type                         "pipewire"
    name                         "PipeWire Output"
}

# 2. Salida FIFO para visualizador de ondas / espectro (ncmpcpp y cava)
# Nota: La tasa y formato están estandarizados a 44100:16:2
audio_output {
    type                         "fifo"
    name                         "Visualizer Feed"
    path                         "/tmp/mpd.fifo"
    format                       "44100:16:2"
}
