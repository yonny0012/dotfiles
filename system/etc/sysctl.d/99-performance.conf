# === VM / Memory ===
# zram (priority 100) is the first swap tier: compressing to RAM is cheaper
# than dropping page cache and re-reading from disk.
vm.swappiness = 100
# zram has no seek cost: read swapped pages one at a time.
vm.page-cluster = 0
vm.vfs_cache_pressure = 50
# Smaller, more frequent writeback to avoid I/O stalls.
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.dirty_expire_centisecs = 1500
vm.dirty_writeback_centisecs = 300

# === Network ===
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.core.somaxconn = 8192
net.core.netdev_max_backlog = 4096

# === Kernel ===
# Frees a perf counter; not needed on a desktop.
kernel.nmi_watchdog = 0
